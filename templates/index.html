<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Landing Page Personalizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .personalization-card {
            position: fixed;
            top: 40px;
            right: 20px;
            z-index: 9999;
            width: 350px;
            animation: slideIn 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        @keyframes slideIn {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .iframe-container {
            width: 100%;
            height: 70vh;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            overflow: hidden;
            background: #f9fafb;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8 text-slate-900">
    <div class="max-w-5xl mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-100">
        <div class="p-8">
            <h1 class="text-4xl font-extrabold text-center bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent mb-8">
                💙 AI Landing Page Personalizer
            </h1>

            <form action="/generate" method="POST" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-10">
                <div class="md:col-span-1">
                    <input type="text" name="interest" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="Your Interest (e.g. apple)" required>
                </div>
                <div class="md:col-span-1">
                    <input type="url" name="url" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="https://example.com" required>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg transition transform hover:-translate-y-1">
                    Generate
                </button>
            </form>

            {% if error %}
                <div class="p-4 bg-red-50 text-red-600 rounded-lg mb-6 text-center">{{ error }}</div>
            {% endif %}

            {% if personalized_content %}
                <div class="space-y-4">
                    <h2 class="text-xl font-bold flex items-center gap-2">
                        ✨ Live Preview for <span class="text-blue-600">{{ interest }}</span>:
                    </h2>
                    
                    <div class="relative">
                        <div class="iframe-container">
                            <iframe src="{{ target_url }}"></iframe>
                        </div>

                        <div class="personalization-card">
                            {{ personalized_content | safe }}
                        </div>
                    </div>
                </div>
            {% endif %}
        </div>
    </div>
    
    <p class="text-center text-slate-400 mt-6 text-sm">Built for Troopod PM Assignment</p>
</body>
</html>
