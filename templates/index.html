<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Landing Page Personalizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Is section mein maine changes kiye hain */
        .personalization-card {
            position: fixed; /* Pehle absolute tha, ab fixed hai */
            top: 20px;       /* Top se thoda niche */
            right: 20px;     /* Right side mein chipka hua */
            z-index: 9999;   /* Taaki ye hamesha sabse upar dikhe */
            width: 320px;    /* Card ki width fix kar di */
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border-radius: 15px;
            background: white;
            border-left: 5px solid #2563eb;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        iframe {
            width: 100%;
            height: 600px;
            border: none;
            border-radius: 8px;
        }
    </style>
</head>
<body class="bg-blue-50 min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl p-6">
        <h1 class="text-3xl font-bold text-center text-blue-900 mb-8">
            💙 AI Landing Page Personalizer
        </h1>

        <form action="/generate" method="POST" class="space-y-4 mb-8">
            <div>
                <textarea name="interest" rows="2" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="What are you interested in? (e.g. apple, fitness, travel)"></textarea>
            </div>
            <div>
                <input type="url" name="url" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="https://example.com" required>
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition duration-200">
                Generate
            </button>
        </form>

        {% if personalized_content %}
        <div class="mt-8">
            <h2 class="text-xl font-semibold mb-4 text-gray-800">✨ Personalized Landing Experience:</h2>
            
            <div class="relative border-2 border-gray-200 rounded-xl overflow-hidden bg-gray-100">
                <iframe src="{{ target_url }}"></iframe>

                <div class="personalization-card p-6">
                    <div class="text-center">
                        <span class="text-4xl mb-2 block">🚀</span>
                        <h3 class="text-2xl font-bold text-blue-900 mb-2">Special Offer: {{ interest }}</h3>
                        <p class="text-gray-600 mb-4">
                            We've personalized this experience based on your interest.
                        </p>
                        <button class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold">
                            Claim Now
                        </button>
                    </div>
                </div>
            </div>
        </div>
        {% endif %}
    </div>
</body>
</html>
